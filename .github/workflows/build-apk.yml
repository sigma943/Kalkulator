name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Keystore & Environment
        run: |
          # Recreate debug.keystore from base64 if available, or generate a fresh one
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Create empty .env if not present
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build-artifacts/Kalkulator-Debug.apk \;
          echo "Built APK files:"
          ls -la build-artifacts/

      - name: Upload APK to Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Debug-APK
          path: build-artifacts/Kalkulator-Debug.apk
          retention-days: 30

      - name: Create GitHub Release (on version tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/Kalkulator-Debug.apk
          generate_release_notes: true
